    <title>Buton Örneği</title>
    <style>

            text-align: center;

</head>
<body>

            if (confirm("Tamam butonuna basarsanız yeni bir sayfa açılacak.")) {
               
            }
        });

        
        document.getElementById('colorButton').addEventListener('click', function() {

                                Math.floor(Math.random() * 256) + ',' +
