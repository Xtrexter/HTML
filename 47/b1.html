<!DOCTYPE html>

<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title> İletişim Formu</title>

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <link rel="stylesheet" href="styles.css">

</head>

<body>


    <nav class="navbar navbar-expand-lg navbar-light bg-light">

        <a class="navbar-brand" href="#">Araçlar ve Kitaplar</a>

        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav">

                <li class="nav-item active">

                    <a class="nav-link" href="#">Ana Sayfa</a>

                </li>

                <li class="nav-item">

                    <a class="nav-link" href="#">Araçlar</a>

                </li>

                <li class="nav-item">

                    <a class="nav-link" href="#">Kitaplar</a>

                </li>

                <li class="nav-item">

                    <a class="nav-link" href="#">İletişim</a>

                </li>

            </ul>

        </div>

    </nav>


    <div class="container mt-5">

        <h2>İletişim Formu</h2>

        <form>

            <div class="form-group">

                <label for="firstName">İsim:</label>

                <input type="text" class="form-control" id="firstName" placeholder="İsminizi girin" required>

            </div>

            <div class="form-group">

                <label for="lastName">Soy İsim:</label>

                <input type="text" class="form-control" id="lastName" placeholder="Soyisminizi girin" required>

            </div>

            <div class="form-group">

                <label for="email">E-posta:</label>

                <input type="email" class="form-control" id="email" placeholder="E-posta adresinizi girin" required>

            </div>

            <div class="form-group">

                <label for="address">Adres:</label>

                <textarea class="form-control" id="address" rows="3" placeholder="Adresinizi girin" required></textarea>

            </div>

            <div class="form-group">

                <label for="phone">Telefon:</label>

                <input type="tel" class="form-control" id="phone" placeholder="Telefon numaranızı girin" required>

            </div>

            <div class="form-group">

                <label>Öğrenim Durumu:</label>

                <select class="form-control" id="education">

                    <option>İlkokul</option>

                    <option>Ortaokul</option>

                    <option>Lise</option>

                    <option>Üniversite</option>

                </select>

            </div>

            <div class="form-check">

                <label class="form-check-label">

                    <input type="checkbox" class="form-check-input"> Web tasarım yapabiliyorum.

                </label>

            </div>

            <div class="form-check">

                <label class="form-check-label">

                    <input type="checkbox" class="form-check-input"> Mobil uygulama yapabiliyorum.

                </label>

            </div>

            <div class="form-check">

                <label class="form-check-label">

                    <input type="radio" class="form-check-input" name="graduation" value="mezun"> Mezun

                </label>

            </div>

            <div class="form-check">

                <label class="form-check-label">

                    <input type="radio" class="form-check-input" name="graduation" value="mezun_degil"> Mezun değil

                </label>

            </div>

            <button type="submit" class="btn btn-primary">Gönder</button>

        </form>

    </div>


    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>

    <script
