<!DO<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satranç Tahtası</title>
    <style>
        #tahtaCerceve {
            width: 240px;
            height: 240px;
            border: 3px solid black;
        }

        .kareBeyaz {
            width: 30px;
            height: 30px;
            background-color: white;
            float: left;
        }

        .kareSiyah {
            width: 30px;
            height: 30px;
            background-color: black;
            float: left;
        }
    </style>
</head>
<body>
    <div id="tahtaCerceve"></div>
    <input type="button" onclick="satranc()" value="Tahtayı Oluştur">
    <input type="button" onclick="temizle()" value="Tahtayı Temizle">
    <script>
        function satranc() {
            var i, j;
            document.getElementById("tahtaCerceve").innerHTML = ""; 
            for (i = 0; i < 8; i++) {
                for (j = 0; j < 8; j++) {
                    if ((j + i) % 2 == 0) {
                        document.getElementById("tahtaCerceve").innerHTML += "<div class='kareBeyaz'></div>";
                    } else {
                        document.getElementById("tahtaCerceve").innerHTML += "<div class='kareSiyah'></div>";
                    }
                }
            }
        }

        function temizle() {
            document.getElementById("tahtaCerceve").innerHTML = ""; 
        }
    </script>
</body>
</html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reklam Penceresi</title>
    <style>
        #reklamPenceresi {
            display: none; /* Başlangıçta gizli */
            position: fixed;
            top: 20px;
            right: 20px;
            width: 200px;
            padding: 10px;
            background-color: rgba(255, 255, 0, 0.8);
            border: 1px solid #ccc;
            border-radius: 5px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="reklamPenceresi">Bu bir reklam penceresidir!</div>
    <script>
        function reklamGoster() {
            var reklam = document.getElementById("reklamPenceresi");
            reklam.style.display = "block"; 
            setTimeout(function() {
                reklam.style.display = "none";
            }, 3000);
        }

       
        window.onload = reklamGoster;
    </script>
</body>
</html>
