<!DOCTYPE html>

<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <title>İletişim Formu</title>

    <style>

        body {

            background-color: #f8f9fa;

        }

        .form-container {

            margin: 50px auto;

            padding: 30px;

            background-color: white;

            border-radius: 10px;

            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);

        }

    </style>

</head>

<body>


<div class="container form-container">

    <h2>İletişim Formu</h2>

    <form>

        <div class="form-group">

            <label for="firstName">İsim</label>

            <input type="text" class="form-control" id="firstName" placeholder="İsminizi girin" required>

        </div>

        <div class="form-group">

            <label for="lastName">Soy İsim</label>

            <input type="text" class="form-control" id="lastName" placeholder="Soyisminizi girin" required>

        </div>

        <div class="form-group">

            <label for="email">E-posta</label>

            <input type="email" class="form-control" id="email" placeholder="E-posta adresinizi girin" required>

        </div>

        <div class="form-group">

            <label for="address">Adres</label>

            <input type="text" class="form-control" id="address" placeholder="Adresinizi girin" required>

        </div>

        <div class="form-group">

            <label for="phone">Telefon</label>

            <input type="tel" class="form-control" id="phone" placeholder="Telefon numaranızı girin" required>

        </div>

        <div class="form-group">

            <label for="education">Öğrenim Durumu</label>

            <select class="form-control" id="education" required>

                <option value="">Seçiniz</option>

                <option value="ilkokul">İlkokul</option>

                <option value="ortaokul">Ortaokul</option>

                <option value="lise">Lise</option>

                <option value="üniversite">Üniversite</option>

                <option value="yüksek_lisans">Yüksek Lisans</option>

            </select>

        </div>

        <button type="submit" class="btn btn-primary">Gönder</button>

    </form>

</div>


<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>

<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</body>

</html>
