	 <button onclick="reset" class="btn btn-primary btn-block">Hesapla</button>

      let yazili2 = parseFloat(document.getElementById("yazili2").value);
      let performans = parseFloat(document.getElementById("performans").value);

      let ortalama = (yazili1 + yazili2 + performans) / 3;
      let durum = ortalama >= 50 ? `Geçti! Tebrikler!` : `Kaldı`;

      document.getElementById("sonuc").innerText = `Ortalama: ${ortalama.toFixed(2)} - ${durum}`;
    }
  </script>
